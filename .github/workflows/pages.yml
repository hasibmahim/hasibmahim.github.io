name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Least-privilege permissions required by GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and verify Academic CV
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/Syed_Amin_Al_Mahim_CV.pdf.b64 > assets/Syed_Amin_Al_Mahim_CV.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/Syed_Amin_Al_Mahim_CV.pdf')
          data = p.read_bytes()
          assert data.startswith(b'%PDF-'), 'Academic CV is missing a PDF header'
          assert data.rstrip().endswith(b'%%EOF'), 'Academic CV is missing a PDF EOF marker'
          assert len(data) > 5000, 'Academic CV PDF is unexpectedly small'
          print(f'Academic CV verified: {len(data)} bytes')
          PY
          # The Base64 source is a build input and should not be published.
          rm -f assets/Syed_Amin_Al_Mahim_CV.pdf.b64 assets/Syed_Amin_Al_Mahim_CV_v2.pdf

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
